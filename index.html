      radial-gradient(1100px 700px at 72% 18%, #132650 0%, transparent 60%),
      var(--nuit);
    line-height: 1.7;
    font-size: 1.0625rem;
    overflow-x: clip;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--or-clair); outline-offset: 4px; border-radius: 4px; }
  .page { max-width: 1160px; margin: 0 auto; padding: 0 28px; }
  .serif { font-family: "Cormorant Garamond", Georgia, serif; }

  /* En-tete */
  header { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 22px 0; }
  .marque { display: flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 700; letter-spacing: 0.02em; }
  .marque img { width: 46px; height: 42px; object-fit: cover; -webkit-mask: radial-gradient(closest-side, #000 80%, transparent); mask: radial-gradient(closest-side, #000 80%, transparent); }
  .droite { display: flex; align-items: center; gap: 34px; }
  nav.principale { display: flex; gap: 28px; }
  nav.principale a { text-decoration: none; color: var(--brume); font-weight: 500; }
  nav.principale a:hover { color: var(--ivoire); }
  .langues { display: flex; border: 1px solid var(--filet); border-radius: 999px; padding: 3px; }
  .langues button {
    font: inherit; font-size: 0.85rem; font-weight: 700; color: var(--brume); background: none; border: 0;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .langues button[aria-pressed="true"] { background: var(--or); color: var(--nuit); }

  /* Accroche */
  .accroche { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 40px; align-items: center; padding: 48px 0 96px; }
  h1 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: clamp(2.8rem, 6vw, 4.9rem); line-height: 1.02; letter-spacing: -0.01em;
    color: var(--ivoire);
  }
  .accroche p { margin-top: 26px; max-width: 32em; color: var(--brume); font-size: 1.15rem; }
  .actions { display: flex; gap: 14px; margin-top: 36px; flex-wrap: wrap; }
  .btn {
    display: inline-block; text-decoration: none; font-weight: 700; padding: 15px 26px; border-radius: 999px;
    background: linear-gradient(180deg, var(--or-clair), var(--or) 55%, var(--or-fonce));
    color: var(--nuit);
  }
  .btn.contour { background: none; color: var(--or-clair); box-shadow: inset 0 0 0 1px var(--or); }
  .btn:hover { filter: brightness(1.08); }

  .embleme { position: relative; justify-self: center; width: min(100%, 480px); overflow: hidden; }
  .embleme img {
    width: 100%; display: block;
    -webkit-mask: radial-gradient(closest-side, #000 72%, transparent 100%);
    mask: radial-gradient(closest-side, #000 72%, transparent 100%);
  }
  .embleme::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(105deg, transparent 35%, rgba(255, 240, 200, 0.45) 50%, transparent 65%);
    -webkit-mask: radial-gradient(closest-side, #000 60%, transparent 90%);
    mask: radial-gradient(closest-side, #000 60%, transparent 90%);
    mix-blend-mode: overlay; transform: translateX(-120%);
    animation: reflet 2.4s 0.6s cubic-bezier(.4, 0, .2, 1) forwards;
  }
  @keyframes reflet { to { transform: translateX(120%); } }

  /* Sections */
  section { padding: 88px 0; border-top: 1px solid var(--filet); }
  h2 {
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: clamp(2.1rem, 4vw, 3.1rem); line-height: 1.08; margin-bottom: 18px;
  }
  .texte { color: var(--brume); max-width: 36em; }

  /* Passion */
  .passion { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 64px; }
  .manifeste { font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(1.35rem, 2.2vw, 1.65rem); line-height: 1.55; color: var(--ivoire); max-width: 30em; }
  .principes { list-style: none; display: grid; gap: 30px; align-content: start; padding-top: 10px; }
  .principes li { display: grid; grid-template-columns: 22px 1fr; gap: 16px; }
  .gemme { width: 12px; height: 12px; margin-top: 8px; transform: rotate(45deg); background: var(--emeraude); box-shadow: 0 0 14px rgba(61, 220, 151, 0.6); }
  .principes strong { display: block; color: var(--or-clair); font-weight: 700; }
  .principes span { color: var(--brume); }

  /* Jeux */
  .jeux { margin-top: 36px; border-top: 1px solid var(--filet); }
  .jeu { display: grid; grid-template-columns: 76px 1fr auto; gap: 26px; align-items: center; padding: 26px 0; border-bottom: 1px solid var(--filet); }
  .icone {
    width: 76px; height: 76px; border-radius: 20px; overflow: hidden; display: grid; place-items: center;
    background: var(--nuit-2); box-shadow: inset 0 0 0 1px var(--or); color: var(--or-clair);
    font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 1.8rem;
  }
  .icone img { width: 100%; height: 100%; object-fit: cover; }
  .jeu h3 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 1.65rem; line-height: 1.15; }
  .jeu p { color: var(--brume); max-width: 36em; }
  .magasins { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .magasins a { text-decoration: none; font-weight: 700; font-size: 0.92rem; padding: 10px 18px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--or); color: var(--or-clair); }
  .magasins a:hover { background: var(--or); color: var(--nuit); }
  .bientot { font-size: 0.92rem; font-weight: 500; color: var(--brume); }

  /* Studio */
  .studio { display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 64px; align-items: start; }
  .studio .texte + .texte { margin-top: 18px; }

  /* Contact */
  .contact { text-align: center; }
  .contact .texte { margin: 0 auto; }
  .contact a.mail {
    display: inline-block; margin-top: 30px; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600;
    font-size: clamp(1.6rem, 4.4vw, 2.8rem); color: var(--or-clair); text-decoration: none;
    border-bottom: 1px solid var(--or); padding-bottom: 4px; word-break: break-all;
  }

  footer { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 14px; padding: 36px 0 52px; border-top: 1px solid var(--filet); color: var(--brume); font-size: 0.92rem; }
  footer a { text-decoration: none; }
  footer a:hover { color: var(--ivoire); }

  @media (max-width: 900px) {
    .accroche, .passion, .studio { grid-template-columns: 1fr; }
    .accroche { padding-top: 16px; }
    .embleme { order: -1; width: min(78%, 360px); }
    nav.principale { display: none; }
    .jeu { grid-template-columns: 60px 1fr; gap: 18px; }
    .icone { width: 60px; height: 60px; border-radius: 16px; font-size: 1.4rem; }
    .magasins { grid-column: 1 / -1; justify-content: flex-start; }
    .marque span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .embleme::after { animation: none; display: none; }
  }
</style>
</head>

  liste.innerHTML = "";
  CONFIG.jeux.forEach(j => {
    const init = j.nom.split(/\s+/).map(m => m[0]).join("").slice(0, 2).toUpperCase();
    const liens = [
      j.play && `<a href="${echapper(j.play)}" target="_blank" rel="noopener">Google Play</a>`,
      j.appstore && `<a href="${echapper(j.appstore)}" target="_blank" rel="noopener">App Store</a>`,
    ].filter(Boolean).join("");
    const el = document.createElement("article");
    el.className = "jeu";
    el.innerHTML = `
      <div class="icone">${j.icone ? `<img src="${echapper(j.icone)}" alt="">` : init}</div>
      <div><h3>${echapper(j.nom)}</h3><p>${echapper(j.pitch[l] || j.pitch.en)}</p></div>
      <div class="magasins">${liens || `<span class="bientot">${I18N[l].bientot}</span>`}</div>`;
    liste.appendChild(el);
  });
}

function langue(l) {
  if (!I18N[l]) l = "en";
  const t = I18N[l];
  document.documentElement.lang = l;
  document.title = t.title;
  document.querySelector('meta[name="description"]').content = t.desc;
  document.querySelectorAll("[data-i18n]").forEach(e => { e.textContent = t[e.dataset.i18n]; });
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
  afficherJeux(l);
  try { localStorage.setItem("langue", l); } catch (e) {}
  const url = new URL(location.href); url.searchParams.set("lang", l); history.replaceState(null, "", url);
}

document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => langue(b.dataset.lang)));
const mail = document.querySelector("[data-email]");
mail.textContent = CONFIG.email; mail.href = "mailto:" + CONFIG.email;
document.getElementById("annee").textContent = new Date().getFullYear();

let initiale = new URLSearchParams(location.search).get("lang");
if (!initiale) { try { initiale = localStorage.getItem("langue"); } catch (e) {} }
if (!initiale) initiale = (navigator.language || "en").slice(0, 2);
langue(initiale);
</script>
</body>
